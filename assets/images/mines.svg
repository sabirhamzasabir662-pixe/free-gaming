<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e0e" />
      <stop offset="100%" stop-color="#080404" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg-mines)" />

  <!-- Minefield grid with numbers -->
  <g transform="translate(180, 80)">
    <!-- 4x4 mini grid -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="#261a1a" stroke="#ef4444" stroke-width="1.5" />
    <text x="30" y="42" fill="#ef4444" font-size="28" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">1</text>

    <rect x="70" y="0" width="60" height="60" rx="8" fill="#261a1a" stroke="#f97316" stroke-width="1.5" />
    <text x="100" y="42" fill="#f97316" font-size="28" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">2</text>

    <rect x="140" y="0" width="60" height="60" rx="8" fill="#261a1a" stroke="#ef4444" stroke-width="1.5" />
    <text x="170" y="42" fill="#ef4444" font-size="28" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">1</text>

    <rect x="210" y="0" width="60" height="60" rx="8" fill="#1e1414" stroke="#451a1a" stroke-width="1.5" />
    <text x="240" y="40" fill="#f87171" font-size="22" text-anchor="middle">🚩</text>

    <!-- Row 2 -->
    <rect x="0" y="70" width="60" height="60" rx="8" fill="#261a1a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="30" y="112" fill="#60a5fa" font-size="28" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">3</text>

    <!-- Center Mine -->
    <rect x="70" y="70" width="60" height="60" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" filter="drop-shadow(0 0 12px #ef4444)" />
    <circle cx="100" cy="100" r="14" fill="#ef4444" />
    <line x1="80" y1="100" x2="120" y2="100" stroke="#ef4444" stroke-width="3" />
    <line x1="100" y1="80" x2="100" y2="120" stroke="#ef4444" stroke-width="3" />
    <line x1="86" y1="86" x2="114" y2="114" stroke="#ef4444" stroke-width="3" />
    <line x1="86" y1="114" x2="114" y2="86" stroke="#ef4444" stroke-width="3" />

    <rect x="140" y="70" width="60" height="60" rx="8" fill="#1e1414" stroke="#451a1a" stroke-width="1.5" />
    <rect x="210" y="70" width="60" height="60" rx="8" fill="#261a1a" stroke="#10b981" stroke-width="1.5" />
    <text x="240" y="112" fill="#34d399" font-size="28" font-family="'Courier New', monospace" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <text x="30" y="45" fill="#ef4444" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2">MINE_SWEEPER // CYBER DECRYPT</text>
  <text x="510" y="45" fill="#f87171" font-family="'Courier New', monospace" font-size="12">MINES: 12</text>
  <path d="M 30 55 L 610 55" stroke="rgba(239, 68, 68, 0.2)" stroke-width="1"/>
</svg>
