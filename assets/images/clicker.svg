<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-clicker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0f00" />
      <stop offset="50%" stop-color="#140800" />
      <stop offset="100%" stop-color="#080200" />
    </linearGradient>
    <radialGradient id="sunburst" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff5500" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff3300" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-orange" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg-clicker)" />

  <!-- Sunburst glow behind central core -->
  <circle cx="320" cy="180" r="160" fill="url(#sunburst)" />

  <!-- Particle rays -->
  <g stroke="rgba(255, 170, 0, 0.2)" stroke-width="2" stroke-dasharray="6,6">
    <line x1="320" y1="20" x2="320" y2="340" />
    <line x1="160" y1="180" x2="480" y2="180" />
    <line x1="206" y1="66" x2="434" y2="294" />
    <line x1="206" y1="294" x2="434" y2="66" />
  </g>

  <!-- Glowing Energy Orb / Core -->
  <circle cx="320" cy="180" r="70" fill="#2b1400" stroke="#ff8800" stroke-width="4" filter="url(#glow-orange)" />
  <circle cx="320" cy="180" r="54" fill="none" stroke="#ffa333" stroke-width="2" stroke-dasharray="10, 5" />
  <circle cx="320" cy="180" r="40" fill="#ff7700" opacity="0.6" />
  <circle cx="320" cy="180" r="26" fill="#fff5cc" filter="drop-shadow(0 0 10px #ffaa00)" />

  <!-- Cursor clicking in -->
  <g transform="translate(350, 190) rotate(-15)" filter="drop-shadow(0 0 12px #ffaa00)">
    <path d="M 0 0 L 0 50 L 14 36 L 24 60 L 34 56 L 24 32 L 40 32 Z" fill="#ffffff" stroke="#ff5500" stroke-width="2.5" />
  </g>

  <!-- Shockwave rings -->
  <circle cx="320" cy="180" r="95" fill="none" stroke="#ff7700" stroke-width="2" opacity="0.4" stroke-dasharray="8 4" />
  <circle cx="320" cy="180" r="120" fill="none" stroke="#ffaa00" stroke-width="1.5" opacity="0.25" />

  <!-- Floating "+100 CPS" text effect -->
  <text x="430" y="130" fill="#ffcc00" font-family="'Courier New', monospace" font-size="18" font-weight="bold" filter="drop-shadow(0 0 8px #ff7700)">+150 CPS!</text>
  <text x="170" y="240" fill="#ff7700" font-family="'Courier New', monospace" font-size="16" font-weight="bold">x4 COMBO</text>

  <!-- High-tech HUD labels -->
  <text x="30" y="45" fill="#ff9900" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2">CYBER_CLICKER // OVERDRIVE</text>
  <text x="510" y="45" fill="#ffaa00" font-family="'Courier New', monospace" font-size="12" letter-spacing="1">12.8 CPS</text>
  <path d="M 30 55 L 610 55" stroke="rgba(255, 153, 0, 0.2)" stroke-width="1"/>
</svg>
