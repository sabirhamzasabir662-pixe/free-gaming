<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ttt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a24" />
      <stop offset="50%" stop-color="#0e061a" />
      <stop offset="100%" stop-color="#06020c" />
    </linearGradient>
    <filter id="glow-purple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg-ttt)" />

  <!-- Ambient glow -->
  <circle cx="240" cy="180" r="140" fill="#a855f7" opacity="0.15" />
  <circle cx="400" cy="180" r="140" fill="#06b6d4" opacity="0.15" />

  <!-- Subtle grid dots -->
  <g fill="rgba(255,255,255,0.06)">
    <circle cx="100" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="480" cy="80" r="2"/><circle cx="540" cy="80" r="2"/>
    <circle cx="100" cy="280" r="2"/><circle cx="160" cy="280" r="2"/><circle cx="480" cy="280" r="2"/><circle cx="540" cy="280" r="2"/>
  </g>

  <!-- 3x3 Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="4" stroke-linecap="round">
    <!-- Vertical lines -->
    <line x1="260" y1="60" x2="260" y2="300" />
    <line x1="380" y1="60" x2="380" y2="300" />
    <!-- Horizontal lines -->
    <line x1="140" y1="140" x2="500" y2="140" />
    <line x1="140" y1="220" x2="500" y2="220" />
  </g>

  <!-- Glowing X's (Neon Purple / Violet) -->
  <g stroke="#c084fc" stroke-width="8" stroke-linecap="round" filter="url(#glow-purple)">
    <!-- Top-Left X -->
    <line x1="180" y1="80" x2="220" y2="120" />
    <line x1="220" y1="80" x2="180" y2="120" />
    <!-- Center X -->
    <line x1="300" y1="160" x2="340" y2="200" />
    <line x1="340" y1="160" x2="300" y2="200" />
    <!-- Bottom-Right X -->
    <line x1="420" y1="240" x2="460" y2="280" />
    <line x1="460" y1="240" x2="420" y2="280" />
  </g>

  <!-- Glowing O's (Neon Cyan / Electric Blue) -->
  <g stroke="#22d3ee" stroke-width="7" fill="none" filter="url(#glow-cyan)">
    <!-- Center-Top O -->
    <circle cx="320" cy="100" r="24" />
    <!-- Bottom-Left O -->
    <circle cx="200" cy="260" r="24" />
  </g>

  <!-- Winning strike line -->
  <line x1="160" y1="60" x2="480" y2="300" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="drop-shadow(0 0 8px #f43f5e)" />

  <!-- High-tech HUD labels -->
  <text x="30" y="45" fill="#c084fc" font-family="'Courier New', monospace" font-size="13" font-weight="bold" letter-spacing="2">NEON_TIC_TAC_TOE // VS AI</text>
  <text x="520" y="45" fill="#22d3ee" font-family="'Courier New', monospace" font-size="12" letter-spacing="1">ROUND 03</text>
  <path d="M 30 55 L 610 55" stroke="rgba(192, 132, 252, 0.2)" stroke-width="1"/>
</svg>
