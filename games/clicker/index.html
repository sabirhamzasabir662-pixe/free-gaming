<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Clicker & Speed Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #0f0700;
      color: #f8fafc;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 16px;
    }
    .wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    /* Tabs */
    .tabs-nav {
      display: flex;
      background: rgba(36, 18, 0, 0.8);
      border: 1px solid rgba(255, 153, 0, 0.3);
      border-radius: 12px;
      padding: 4px;
      width: 100%;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 700;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #ff9900;
      color: #100500;
      box-shadow: 0 0 15px rgba(255, 153, 0, 0.5);
    }

    /* Common Card */
    .panel {
      width: 100%;
      background: #180b00;
      border: 1px solid rgba(255, 153, 0, 0.25);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 153, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
    }

    /* Speed Test Specifics */
    .test-timer-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
    }
    .time-selector {
      display: flex;
      gap: 6px;
    }
    .time-btn {
      background: #2b1400;
      border: 1px solid rgba(255, 153, 0, 0.3);
      color: #ffaa33;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .time-btn.active {
      background: #ff9900;
      color: #000;
      font-weight: 700;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
    }
    .stat-box {
      background: rgba(43, 20, 0, 0.6);
      border: 1px solid rgba(255, 153, 0, 0.2);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-box .lbl {
      font-size: 10px;
      text-transform: uppercase;
      color: #94a3b8;
      display: block;
    }
    .stat-box .val {
      font-size: 20px;
      font-weight: 800;
      color: #ffaa33;
      font-family: monospace;
    }

    /* Click Targets */
    .click-target-test {
      width: 100%;
      height: 180px;
      background: radial-gradient(circle, #3d1b00 0%, #1c0a00 100%);
      border: 2px dashed rgba(255, 153, 0, 0.4);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.05s;
    }
    .click-target-test:active {
      transform: scale(0.98);
      border-color: #ff9900;
      background: radial-gradient(circle, #522400 0%, #240d00 100%);
    }
    .click-prompt {
      font-size: 18px;
      font-weight: 800;
      color: #ffaa33;
      text-shadow: 0 0 10px rgba(255, 153, 0, 0.5);
    }
    .click-subtext {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }

    /* Incremental Core */
    .reactor-core {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffaa00 0%, #cc5500 50%, #4a1500 100%);
      box-shadow: 0 0 40px rgba(255, 153, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.08s ease-out;
      border: 4px solid #fff3cc;
    }
    .reactor-core:active {
      transform: scale(0.92);
      box-shadow: 0 0 60px rgba(255, 170, 0, 0.9);
    }
    .reactor-core span {
      font-size: 40px;
    }

    /* Upgrades List */
    .upgrades-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .upgrade-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #261100;
      border: 1px solid rgba(255, 153, 0, 0.2);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .upgrade-item:hover:not(.disabled) {
      border-color: #ffaa33;
      background: #361800;
      transform: translateY(-1px);
    }
    .upgrade-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .upg-info {
      display: flex;
      flex-direction: column;
    }
    .upg-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .upg-rate {
      font-size: 11px;
      color: #ffaa33;
    }
    .upg-cost {
      font-size: 12px;
      font-weight: 700;
      color: #f59e0b;
      background: #140800;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 153, 0, 0.3);
    }

    /* Particle / Floater */
    .floating-num {
      position: absolute;
      color: #ffea00;
      font-size: 18px;
      font-weight: 900;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
      text-shadow: 0 0 8px rgba(255, 153, 0, 0.8);
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-40px) scale(1.3); opacity: 0; }
    }

    .btn-action {
      background: linear-gradient(135deg, #ff9900, #ff5500);
      color: #fff;
      font-weight: 700;
      border: none;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
    }
    .btn-action:hover {
      box-shadow: 0 0 22px rgba(255, 153, 0, 0.7);
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="tabs-nav">
      <button class="tab-btn active" id="tabTest">⚡ CPS SPEED TEST</button>
      <button class="tab-btn" id="tabReactor">⚛ CYBER REACTOR</button>
    </div>

    <!-- PANEL 1: SPEED TEST -->
    <div class="panel" id="panelTest">
      <div class="test-timer-row">
        <div class="time-selector">
          <button class="time-btn active" data-time="5">5s Test</button>
          <button class="time-btn" data-time="10">10s Test</button>
        </div>
        <div id="testRank" style="font-size:12px; font-weight:700; color:#ffaa33;">RANK: READY</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <span class="lbl">Time Left</span>
          <span class="val" id="testTimeLeft">5.0s</span>
        </div>
        <div class="stat-box">
          <span class="lbl">Clicks</span>
          <span class="val" id="testClicks">0</span>
        </div>
        <div class="stat-box">
          <span class="lbl">CPS</span>
          <span class="val" id="testCps">0.0</span>
        </div>
      </div>

      <div class="click-target-test" id="clickAreaTest">
        <div class="click-prompt" id="testPrompt">TAP TO START</div>
        <div class="click-subtext" id="testSubtext">Click as fast as you can!</div>
      </div>

      <button class="btn-action" id="btnResetTest">RESET TEST</button>
    </div>

    <!-- PANEL 2: INCREMENTAL REACTOR -->
    <div class="panel" id="panelReactor" style="display:none;">
      <div style="text-align:center;">
        <span style="font-size:11px; text-transform:uppercase; color:#94a3b8; letter-spacing:1px;">Quantum Energy</span>
        <div style="font-size:28px; font-weight:900; color:#ffaa33; font-family:monospace;" id="reactorEnergy">0</div>
        <div style="font-size:12px; color:#f59e0b;" id="reactorPerSec">+0 energy / sec</div>
      </div>

      <div class="reactor-core" id="reactorCore">
        <span>⚡</span>
      </div>

      <div class="upgrades-list" id="upgradesContainer">
        <!-- Injected via JS -->
      </div>
    </div>
  </div>

  <script>
    // Audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playClickTone(freq = 600, duration = 0.05) {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Tab Switching
    const tabTest = document.getElementById('tabTest');
    const tabReactor = document.getElementById('tabReactor');
    const panelTest = document.getElementById('panelTest');
    const panelReactor = document.getElementById('panelReactor');

    tabTest.addEventListener('click', () => {
      tabTest.classList.add('active');
      tabReactor.classList.remove('active');
      panelTest.style.display = 'flex';
      panelReactor.style.display = 'none';
    });

    tabReactor.addEventListener('click', () => {
      tabReactor.classList.add('active');
      tabTest.classList.remove('active');
      panelReactor.style.display = 'flex';
      panelTest.style.display = 'none';
    });

    // ==========================================
    // CPS SPEED TEST LOGIC
    // ==========================================
    let testDuration = 5;
    let testTimeRemaining = 5;
    let testClicksCount = 0;
    let testState = 'idle'; // 'idle', 'running', 'finished'
    let testTimer = null;
    let testStartTime = 0;

    const testTimeLeftEl = document.getElementById('testTimeLeft');
    const testClicksEl = document.getElementById('testClicks');
    const testCpsEl = document.getElementById('testCps');
    const testRankEl = document.getElementById('testRank');
    const clickAreaTest = document.getElementById('clickAreaTest');
    const testPrompt = document.getElementById('testPrompt');
    const testSubtext = document.getElementById('testSubtext');

    document.querySelectorAll('.time-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (testState === 'running') return;
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        testDuration = parseInt(btn.dataset.time, 10);
        resetTest();
      });
    });

    function resetTest() {
      clearInterval(testTimer);
      testState = 'idle';
      testTimeRemaining = testDuration;
      testClicksCount = 0;
      testTimeLeftEl.textContent = `${testDuration.toFixed(1)}s`;
      testClicksEl.textContent = '0';
      testCpsEl.textContent = '0.0';
      testRankEl.textContent = 'RANK: READY';
      testPrompt.textContent = 'TAP TO START';
      testSubtext.textContent = 'Click as fast as you can!';
    }

    function spawnFloater(container, x, y, text) {
      const el = document.createElement('div');
      el.className = 'floating-num';
      el.textContent = text;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      container.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    function handleTestClick(e) {
      const rect = clickAreaTest.getBoundingClientRect();
      const clickX = (e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
      const clickY = (e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height / 2)) - rect.top;

      playClickTone(450 + Math.random() * 200, 0.04);
      spawnFloater(clickAreaTest, clickX, clickY, '+1');

      if (testState === 'idle') {
        testState = 'running';
        testClicksCount = 1;
        testStartTime = performance.now();
        testClicksEl.textContent = testClicksCount;
        testPrompt.textContent = 'KEEP CLICKING!';
        testSubtext.textContent = 'Hammer the button!';

        testTimer = setInterval(() => {
          const elapsed = (performance.now() - testStartTime) / 1000;
          testTimeRemaining = Math.max(0, testDuration - elapsed);
          testTimeLeftEl.textContent = `${testTimeRemaining.toFixed(1)}s`;

          const currentCps = (testClicksCount / Math.max(elapsed, 0.1)).toFixed(1);
          testCpsEl.textContent = currentCps;

          if (testTimeRemaining <= 0) {
            finishTest();
          }
        }, 50);
      } else if (testState === 'running') {
        testClicksCount++;
        testClicksEl.textContent = testClicksCount;
      }
    }

    function finishTest() {
      clearInterval(testTimer);
      testState = 'finished';
      testTimeLeftEl.textContent = '0.0s';
      const finalCps = (testClicksCount / testDuration).toFixed(2);
      testCpsEl.textContent = finalCps;
      testPrompt.textContent = `DONE! ${finalCps} CPS`;

      let rank = '🐢 SLOTH';
      if (finalCps >= 14) rank = '⚡ GODSPEED';
      else if (finalCps >= 11) rank = '🔥 CYBER SONIC';
      else if (finalCps >= 8) rank = '🐆 HYPER CHEETAH';
      else if (finalCps >= 5) rank = '🦅 FAST REFLEX';
      else rank = '🐾 CASUAL CLICKER';

      testRankEl.textContent = `RANK: ${rank}`;
      testSubtext.textContent = `Score: ${testClicksCount} clicks in ${testDuration}s!`;
      playClickTone(880, 0.2);
    }

    clickAreaTest.addEventListener('mousedown', handleTestClick);
    clickAreaTest.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleTestClick(e);
    });
    document.getElementById('btnResetTest').addEventListener('click', resetTest);

    // ==========================================
    // CYBER REACTOR INCREMENTAL LOGIC
    // ==========================================
    let energy = parseInt(localStorage.getItem('reactor_energy') || '0', 10);
    let clickPower = 1;

    const upgrades = [
      { id: 'mouse', name: 'Supercharged Mouse', cost: 15, perSec: 0, clickAdd: 1, owned: 0 },
      { id: 'nano', name: 'Nano Auto-Tap', cost: 50, perSec: 2, clickAdd: 0, owned: 0 },
      { id: 'core', name: 'Plasma Injector', cost: 250, perSec: 12, clickAdd: 0, owned: 0 },
      { id: 'singularity', name: 'Quantum Overdrive', cost: 1200, perSec: 65, clickAdd: 0, owned: 0 }
    ];

    // Load saved upgrades if any
    try {
      const savedUpg = JSON.parse(localStorage.getItem('reactor_upgrades'));
      if (savedUpg) {
        savedUpg.forEach((saved, i) => {
          if (upgrades[i]) {
            upgrades[i].owned = saved.owned;
            upgrades[i].cost = saved.cost;
          }
        });
      }
    } catch (e) {}

    const energyEl = document.getElementById('reactorEnergy');
    const perSecEl = document.getElementById('reactorPerSec');
    const reactorCore = document.getElementById('reactorCore');
    const upgradesContainer = document.getElementById('upgradesContainer');

    function getEnergyPerSec() {
      return upgrades.reduce((acc, u) => acc + (u.perSec * u.owned), 0);
    }

    function getClickPower() {
      return 1 + (upgrades[0].owned * 1);
    }

    function updateReactorUI() {
      energyEl.textContent = Math.floor(energy).toLocaleString();
      const eps = getEnergyPerSec();
      perSecEl.textContent = `+${eps} energy / sec`;

      upgradesContainer.innerHTML = '';
      upgrades.forEach((upg) => {
        const item = document.createElement('div');
        item.className = `upgrade-item ${energy < upg.cost ? 'disabled' : ''}`;
        item.innerHTML = `
          <div class="upg-info">
            <span class="upg-name">${upg.name} (${upg.owned})</span>
            <span class="upg-rate">${upg.perSec > 0 ? `+${upg.perSec}/s` : `+${upg.clickAdd}/click`}</span>
          </div>
          <div class="upg-cost">${upg.cost} ⚡</div>
        `;
        item.addEventListener('click', () => buyUpgrade(upg));
        upgradesContainer.appendChild(item);
      });
    }

    function buyUpgrade(upg) {
      if (energy >= upg.cost) {
        energy -= upg.cost;
        upg.owned++;
        upg.cost = Math.floor(upg.cost * 1.35);
        playClickTone(800, 0.1);
        saveReactorState();
        updateReactorUI();
      }
    }

    function saveReactorState() {
      localStorage.setItem('reactor_energy', Math.floor(energy));
      localStorage.setItem('reactor_upgrades', JSON.stringify(upgrades.map(u => ({ owned: u.owned, cost: u.cost }))));
    }

    reactorCore.addEventListener('click', (e) => {
      const pwr = getClickPower();
      energy += pwr;
      playClickTone(500, 0.05);

      const rect = reactorCore.getBoundingClientRect();
      const x = e.clientX ? (e.clientX - rect.left) : (rect.width / 2);
      const y = e.clientY ? (e.clientY - rect.top) : (rect.height / 2);
      spawnFloater(reactorCore, x, y, `+${pwr}`);
      updateReactorUI();
    });

    // Idle loop
    setInterval(() => {
      const eps = getEnergyPerSec();
      if (eps > 0) {
        energy += eps / 10;
        updateReactorUI();
      }
    }, 100);

    // Periodic Autosave
    setInterval(saveReactorState, 5000);

    updateReactorUI();
  </script>
</body>
</html>
