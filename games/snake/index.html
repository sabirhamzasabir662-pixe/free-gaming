<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Snake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #080811;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 520px;
      padding: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 10px;
      background: rgba(21, 21, 31, 0.85);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat-label {
      font-size: 10px;
      letter-spacing: 1px;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 700;
      color: #00ff88;
      font-family: monospace;
    }
    .btn-sound {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-sound:hover {
      background: rgba(0, 255, 136, 0.2);
      border-color: #00ff88;
    }
    .canvas-container {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.15), 0 10px 30px rgba(0,0,0,0.8);
      border: 1px solid rgba(0, 255, 136, 0.3);
      background: #040906;
    }
    canvas {
      display: block;
      background: #040b06;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 9, 6, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.2s;
    }
    .overlay.hidden {
      display: none;
    }
    .overlay h2 {
      font-size: 26px;
      color: #00ff88;
      text-shadow: 0 0 15px rgba(0, 255, 136, 0.6);
      letter-spacing: 1.5px;
    }
    .overlay p {
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      max-width: 80%;
    }
    .btn-start {
      background: linear-gradient(135deg, #00ff88, #00b359);
      color: #021a0c;
      font-weight: 700;
      font-size: 15px;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-start:hover {
      transform: scale(1.05);
      box-shadow: 0 0 28px rgba(0, 255, 136, 0.6);
    }
    /* Mobile Virtual D-Pad */
    .controls-panel {
      display: none;
      margin-top: 14px;
      width: 100%;
      justify-content: center;
    }
    @media (max-width: 768px), (pointer: coarse) {
      .controls-panel {
        display: flex;
      }
    }
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
    }
    .d-btn {
      background: #151522;
      border: 1px solid rgba(0, 255, 136, 0.3);
      color: #00ff88;
      border-radius: 10px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      active: scale(0.92);
    }
    .d-btn:active {
      background: rgba(0, 255, 136, 0.25);
    }
    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-center { grid-column: 2; grid-row: 2; opacity: 0.3; }
    .d-right { grid-column: 3; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 3; }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <div class="hud">
      <div class="stat">
        <span class="stat-label">Score</span>
        <span class="stat-val" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Best</span>
        <span class="stat-val" id="best">0</span>
      </div>
      <button class="btn-sound" id="btnSound">🔊 Sound</button>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="overlay" id="startOverlay">
        <h2>CYBER SNAKE</h2>
        <p>Devour quantum power bits, survive the grid, and maximize your trail score.</p>
        <button class="btn-start" id="btnPlay">START GAME</button>
      </div>
      <div class="overlay hidden" id="gameOverOverlay">
        <h2 style="color:#ff3366; text-shadow:0 0 15px rgba(255,51,102,0.6)">SYSTEM CRASH</h2>
        <p id="finalScoreText">Final Score: 0</p>
        <button class="btn-start" id="btnRestart">RETRY</button>
      </div>
    </div>

    <div class="controls-panel">
      <div class="d-pad">
        <button class="d-btn d-up" id="btnUp">▲</button>
        <button class="d-btn d-left" id="btnLeft">◀</button>
        <div class="d-btn d-center">●</div>
        <button class="d-btn d-right" id="btnRight">▶</button>
        <button class="d-btn d-down" id="btnDown">▼</button>
      </div>
    </div>
  </div>

  <script>
    // Web Audio Sound Synthesizer (Zero dependencies)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let soundEnabled = true;

    function playTone(freq, type, duration, vol = 0.1) {
      if (!soundEnabled || !audioCtx) return;
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    const soundEat = () => playTone(587.33, 'triangle', 0.12, 0.15);
    const soundTurn = () => playTone(220, 'sine', 0.04, 0.05);
    const soundDie = () => {
      playTone(130, 'sawtooth', 0.4, 0.2);
      setTimeout(() => playTone(80, 'sawtooth', 0.5, 0.25), 100);
    };

    document.getElementById('btnSound').addEventListener('click', (e) => {
      soundEnabled = !soundEnabled;
      e.target.textContent = soundEnabled ? '🔊 Sound' : '🔇 Muted';
    });

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE; // 20x20

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1;
    let dy = 0;
    let nextDx = 1;
    let nextDy = 0;
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('cyber_snake_best') || '0', 10);
    let gameInterval = null;
    let isRunning = false;
    let particles = [];

    document.getElementById('best').textContent = bestScore;

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      particles = [];
      document.getElementById('score').textContent = score;
      spawnFood();
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function spawnParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x: x * GRID_SIZE + GRID_SIZE / 2,
          y: y * GRID_SIZE + GRID_SIZE / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: Math.random() * 0.05 + 0.03,
          color: color
        });
      }
    }

    function gameLoop() {
      // Update directions
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').textContent = score;
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('cyber_snake_best', bestScore);
          document.getElementById('best').textContent = bestScore;
        }
        soundEat();
        spawnParticles(food.x, food.y, '#ff0055');
        spawnFood();
      } else {
        snake.pop();
      }

      render();
    }

    function render() {
      // Clear
      ctx.fillStyle = '#040b06';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid background
      ctx.strokeStyle = 'rgba(0, 255, 136, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food (Glowing Orb)
      const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
      const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
      
      const glow = ctx.createRadialGradient(fx, fy, 2, fx, fy, 16);
      glow.addColorStop(0, '#ff3366');
      glow.addColorStop(0.5, 'rgba(255, 0, 85, 0.5)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(fx, fy, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ff0055';
      ctx.beginPath();
      ctx.arc(fx, fy, 6, 0, Math.PI * 2);
      ctx.fill();

      // Draw Snake
      snake.forEach((seg, index) => {
        const isHead = index === 0;
        const px = seg.x * GRID_SIZE;
        const py = seg.y * GRID_SIZE;

        if (isHead) {
          ctx.fillStyle = '#38ffaa';
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 12;
        } else {
          ctx.fillStyle = '#00ff88';
          ctx.shadowBlur = 0;
        }

        ctx.fillRect(px + 1, py + 1, GRID_SIZE - 2, GRID_SIZE - 2);

        // Eyes for the head
        if (isHead) {
          ctx.fillStyle = '#05140b';
          const eyeSize = 3;
          if (dx === 1) { // Right
            ctx.fillRect(px + 13, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + 13, py + 13, eyeSize, eyeSize);
          } else if (dx === -1) { // Left
            ctx.fillRect(px + 4, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + 4, py + 13, eyeSize, eyeSize);
          } else if (dy === -1) { // Up
            ctx.fillRect(px + 4, py + 4, eyeSize, eyeSize);
            ctx.fillRect(px + 13, py + 4, eyeSize, eyeSize);
          } else { // Down
            ctx.fillRect(px + 4, py + 13, eyeSize, eyeSize);
            ctx.fillRect(px + 13, py + 13, eyeSize, eyeSize);
          }
        }
      });
      ctx.shadowBlur = 0;

      // Draw & Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function changeDirection(newDx, newDy) {
      if (!isRunning) return;
      // Prevent 180 reverse turns
      if (newDx !== -dx && newDy !== -dy) {
        nextDx = newDx;
        nextDy = newDy;
        soundTurn();
      }
    }

    function startGame() {
      resetGame();
      document.getElementById('startOverlay').classList.add('hidden');
      document.getElementById('gameOverOverlay').classList.add('hidden');
      isRunning = true;
      clearInterval(gameInterval);
      gameInterval = setInterval(gameLoop, 105);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameInterval);
      soundDie();
      document.getElementById('finalScoreText').textContent = `Final Score: ${score}`;
      document.getElementById('gameOverOverlay').classList.remove('hidden');
    }

    // Keyboard handlers
    window.addEventListener('keydown', (e) => {
      if (!isRunning && (e.key === ' ' || e.key === 'Enter')) {
        startGame();
        return;
      }
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (dy !== 1) changeDirection(0, -1);
          e.preventDefault();
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (dy !== -1) changeDirection(0, 1);
          e.preventDefault();
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (dx !== 1) changeDirection(-1, 0);
          e.preventDefault();
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (dx !== -1) changeDirection(1, 0);
          e.preventDefault();
          break;
      }
    });

    // Touch D-Pad buttons
    document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); if (dy !== 1) changeDirection(0, -1); });
    document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); if (dy !== -1) changeDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); if (dx !== 1) changeDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); if (dx !== -1) changeDirection(1, 0); });

    document.getElementById('btnUp').addEventListener('click', () => { if (dy !== 1) changeDirection(0, -1); });
    document.getElementById('btnDown').addEventListener('click', () => { if (dy !== -1) changeDirection(0, 1); });
    document.getElementById('btnLeft').addEventListener('click', () => { if (dx !== 1) changeDirection(-1, 0); });
    document.getElementById('btnRight').addEventListener('click', () => { if (dx !== -1) changeDirection(1, 0); });

    document.getElementById('btnPlay').addEventListener('click', startGame);
    document.getElementById('btnRestart').addEventListener('click', startGame);

    // Initial render
    resetGame();
    render();
  </script>
</body>
</html>
