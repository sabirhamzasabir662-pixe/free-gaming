<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Synthwave Highway 84</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090214;
      color: #fce7f3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
      gap: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #19092c;
      border: 1px solid rgba(244, 63, 94, 0.4);
      border-radius: 12px;
      padding: 8px 16px;
    }
    .stat { display: flex; flex-direction: column; }
    .stat-label { font-size: 10px; color: #f472b6; text-transform: uppercase; letter-spacing: 1px; }
    .stat-val { font-size: 18px; font-weight: 700; color: #f43f5e; font-family: monospace; }
    .canvas-container {
      position: relative;
      border: 2px solid rgba(244, 63, 94, 0.5);
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(244, 63, 94, 0.25);
      background: #0d0418;
      overflow: hidden;
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 4, 24, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      backdrop-filter: blur(4px);
    }
    .hidden { display: none !important; }
    h2 { font-size: 24px; color: #fb7185; text-shadow: 0 0 12px #f43f5e; text-align: center; }
    p { font-size: 13px; color: #fbcfe8; text-align: center; max-width: 270px; line-height: 1.4; }
    .btn {
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(244, 63, 94, 0.9); }
    .touch-controls {
      display: flex;
      width: 100%;
      gap: 10px;
      margin-top: 4px;
    }
    .touch-btn {
      flex: 1;
      padding: 14px;
      background: #240b3b;
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      text-align: center;
    }
    .touch-btn:active { background: #3d1066; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="hud">
      <div class="stat">
        <span class="stat-label">Distance</span>
        <span class="stat-val" id="distEl">0m</span>
      </div>
      <div class="stat" style="align-items: center;">
        <span class="stat-label">Speed</span>
        <span class="stat-val" id="speedEl" style="color: #fbbf24;">120 MPH</span>
      </div>
      <div class="stat" style="align-items: flex-end;">
        <span class="stat-label">Best</span>
        <span class="stat-val" id="bestDistEl">0m</span>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="400" height="520"></canvas>
      <div id="startOverlay" class="overlay">
        <h2>SYNTHWAVE 84</h2>
        <p>Cruising into the retrowave horizon. Dodge oncoming traffic across 3 neon lanes!</p>
        <button class="btn" id="startBtn">START ENGINE</button>
      </div>
      <div id="gameOverOverlay" class="overlay hidden">
        <h2 style="color: #f43f5e;">CRASHED!</h2>
        <p>You covered <strong id="finalDist" style="color: #fb7185;">0m</strong> before total collision.</p>
        <button class="btn" id="restartBtn">RESTART RACE</button>
      </div>
    </div>

    <div class="touch-controls">
      <button class="touch-btn" id="leftBtn">◀ LANE LEFT</button>
      <button class="touch-btn" id="boostBtn" style="color: #fbbf24; border-color: rgba(251, 191, 36, 0.5);">⚡ NITRO</button>
      <button class="touch-btn" id="rightBtn">LANE RIGHT ▶</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const distEl = document.getElementById('distEl');
    const speedEl = document.getElementById('speedEl');
    const bestDistEl = document.getElementById('bestDistEl');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const finalDistEl = document.getElementById('finalDist');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let isPlaying = false;
    let animationId;
    let distance = 0;
    let bestDist = parseInt(localStorage.getItem('synthwave_best') || '0', 10);
    bestDistEl.textContent = bestDist + 'm';

    const lanes = [90, 200, 310];
    let currentLane = 1;
    let playerX = lanes[1];
    let playerTargetX = lanes[1];
    let playerY = 430;
    let isNitro = false;
    let baseSpeed = 4;
    let currentSpeed = 4;

    let roadOffset = 0;
    let traffic = [];
    let particles = [];
    let spawnTimer = 0;

    function resetGame() {
      distance = 0;
      currentLane = 1;
      playerX = lanes[1];
      playerTargetX = lanes[1];
      currentSpeed = baseSpeed;
      isNitro = false;
      traffic = [];
      particles = [];
      spawnTimer = 0;
      distEl.textContent = '0m';
      speedEl.textContent = '120 MPH';
    }

    function spawnTraffic() {
      const lane = Math.floor(Math.random() * 3);
      // Ensure not all lanes blocked
      const recentSpawn = traffic.some(t => t.y < 80);
      if (recentSpawn) return;

      const colors = ['#06b6d4', '#eab308', '#a855f7', '#22c55e'];
      traffic.push({
        lane,
        x: lanes[lane],
        y: -70,
        speed: Math.random() * 1.5 + 2,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    function createCrashParticles(x, y) {
      for (let i = 0; i < 25; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = Math.random() * 5 + 1;
        particles.push({
          x, y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          color: Math.random() > 0.5 ? '#f43f5e' : '#fbbf24',
          alpha: 1,
          size: Math.random() * 3 + 2
        });
      }
    }

    function drawSun() {
      // Synthwave Sunset
      const grad = ctx.createLinearGradient(0, 0, 0, 180);
      grad.addColorStop(0, '#f43f5e');
      grad.addColorStop(0.7, '#fbbf24');
      grad.addColorStop(1, '#831843');

      ctx.save();
      ctx.beginPath();
      ctx.arc(200, 150, 70, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 30;
      ctx.fill();

      // Horizontal sun bands
      ctx.fillStyle = '#0d0418';
      for (let i = 0; i < 6; i++) {
        ctx.fillRect(120, 120 + i * 9, 160, 2 + i * 0.7);
      }
      ctx.restore();
    }

    function drawRoad() {
      // Road surface
      ctx.fillStyle = '#0f051d';
      ctx.fillRect(30, 150, 340, 370);

      // Road side borders
      ctx.strokeStyle = '#f43f5e';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(30, 150); ctx.lineTo(30, 520);
      ctx.moveTo(370, 150); ctx.lineTo(370, 520);
      ctx.stroke();

      // Lane dividers
      ctx.setLineDash([25, 20]);
      ctx.lineDashOffset = -roadOffset;
      ctx.strokeStyle = 'rgba(244, 63, 94, 0.4)';
      ctx.lineWidth = 2;
      ctx.shadowBlur = 0;

      ctx.beginPath();
      ctx.moveTo(145, 150); ctx.lineTo(145, 520);
      ctx.moveTo(255, 150); ctx.lineTo(255, 520);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawCar(x, y, color, isPlayer = false) {
      ctx.save();
      ctx.translate(x, y);

      // Tail lights glow
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 14;

      // Chassis
      ctx.beginPath();
      ctx.roundRect(-20, -32, 40, 64, 6);
      ctx.fillStyle = '#1e0c38';
      ctx.fill();
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.stroke();

      // Windshield
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.beginPath();
      ctx.roundRect(-14, -14, 28, 22, 3);
      ctx.fill();

      // Lights
      if (isPlayer) {
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(-17, 24, 8, 4);
        ctx.fillRect(9, 24, 8, 4);
        if (isNitro) {
          // Thruster fire
          ctx.fillStyle = '#38bdf8';
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.moveTo(-10, 32);
          ctx.lineTo(0, 48 + Math.random() * 10);
          ctx.lineTo(10, 32);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(-17, 24, 8, 4);
        ctx.fillRect(9, 24, 8, 4);
      }

      ctx.restore();
    }

    function gameLoop() {
      if (!isPlaying) return;

      currentSpeed = (isNitro ? baseSpeed * 1.8 : baseSpeed) + Math.min(distance / 600, 3.5);
      roadOffset += currentSpeed * 2.5;

      ctx.fillStyle = '#0a0216';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawSun();
      drawRoad();

      // Smooth lane transition
      playerX += (playerTargetX - playerX) * 0.2;
      drawCar(playerX, playerY, '#f43f5e', true);

      // Spawning traffic
      spawnTimer++;
      if (spawnTimer % Math.max(35, 75 - Math.floor(distance / 400)) === 0) {
        spawnTraffic();
      }

      // Update traffic
      for (let i = traffic.length - 1; i >= 0; i--) {
        const car = traffic[i];
        car.y += (currentSpeed - car.speed) * 1.6 + 1.5;
        drawCar(car.x, car.y, car.color, false);

        // Check collision
        if (Math.abs(car.x - playerX) < 32 && Math.abs(car.y - playerY) < 56) {
          createCrashParticles(playerX, playerY);
          endGame();
          return;
        }

        if (car.y > canvas.height + 60) {
          traffic.splice(i, 1);
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.03;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      distance += Math.floor(currentSpeed * 0.8);
      distEl.textContent = distance + 'm';
      speedEl.textContent = Math.floor(currentSpeed * 28) + ' MPH';

      animationId = requestAnimationFrame(gameLoop);
    }

    function moveLane(dir) {
      if (!isPlaying) return;
      currentLane = Math.max(0, Math.min(2, currentLane + dir));
      playerTargetX = lanes[currentLane];
    }

    function startGame() {
      resetGame();
      isPlaying = true;
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      animationId = requestAnimationFrame(gameLoop);
    }

    function endGame() {
      isPlaying = false;
      cancelAnimationFrame(animationId);
      finalDistEl.textContent = distance + 'm';
      if (distance > bestDist) {
        bestDist = distance;
        localStorage.setItem('synthwave_best', bestDist);
        bestDistEl.textContent = bestDist + 'm';
      }
      gameOverOverlay.classList.remove('hidden');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveLane(-1);
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveLane(1);
      if (e.key === ' ' || e.key === 'Shift') isNitro = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === ' ' || e.key === 'Shift') isNitro = false;
    });

    document.getElementById('leftBtn').addEventListener('click', () => moveLane(-1));
    document.getElementById('rightBtn').addEventListener('click', () => moveLane(1));

    const boostBtn = document.getElementById('boostBtn');
    boostBtn.addEventListener('mousedown', () => isNitro = true);
    boostBtn.addEventListener('mouseup', () => isNitro = false);
    boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isNitro = true; });
    boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); isNitro = false; });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
